name: Lean n6 d4 audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: mqg-n6-d4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - linux
      - x64
      - lean-audit-n6d4
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Restore post-build Lean environment
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan
            lake-manifest.json
            .lake/packages
            .lake/build
          key: mqg-lean-v3-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}
      - name: Restore exact-source project build cache
        id: project-cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: mqg-n6d4-project-v1-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            mqg-n6d4-project-v1-${{ runner.os }}-
      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies on cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          lake update > /tmp/lake-update.log 2>&1
          lake exe cache get > /tmp/cache-get.log 2>&1
      - name: Seed exact-source verified GCP build artifacts
        if: steps.project-cache.outputs.cache-hit != 'true'
        run: |
          verified=/mnt/lean/test
          test -f "$verified/.lake/build/lib/lean/MQGN6Audit/NoSolution6.olean"
          diff -qr "$GITHUB_WORKSPACE/MQGN6Audit" "$verified/MQGN6Audit"
          cmp "$GITHUB_WORKSPACE/MQGN6Audit.lean" "$verified/MQGN6Audit.lean"
          cmp "$GITHUB_WORKSPACE/lakefile.toml" "$verified/lakefile.toml"
          cmp "$GITHUB_WORKSPACE/lean-toolchain" "$verified/lean-toolchain"
          mkdir -p .lake/build
          cp -a "$verified/.lake/build/." .lake/build/
      - name: Check final theorem assembly
        id: lean
        run: |
          set +e
          set -o pipefail
          stdbuf -oL -eL lake build MQGN6Audit.NoSolution6 2>&1 | tee /tmp/lean-build.log
          status=${PIPESTATUS[0]}
          set +o pipefail
          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo '<!-- lean-ci-diagnostics -->'
            if [ "$status" -eq 0 ]; then
              echo '## Lean audit: theorem build passing'
              echo
              echo '```text'
              tail -n 30 /tmp/lean-build.log
              echo '```'
            else
              echo '## Lean audit: compiler diagnostics'
              echo
              echo '```text'
              grep -n -E 'error:|unsolved goals|unknown identifier|application type mismatch|type mismatch|invalid field|declaration uses' /tmp/lean-build.log | tail -n 200 || true
              echo '--- final context ---'
              tail -n 140 /tmp/lean-build.log
              echo '```'
            fi
          } > /tmp/lean-comment.md
          cat /tmp/lean-comment.md
      - name: Audit theorem axiom closure and source
        id: trust
        if: steps.lean.outputs.status == '0'
        run: |
          set -o pipefail
          lake env lean AxiomAudit.lean 2>&1 | tee /tmp/lean-axioms.log
          if grep -E 'sorryAx|Lean\.ofReduceBool' /tmp/lean-axioms.log; then
            echo 'Forbidden proof axiom detected.' >&2
            exit 1
          fi
          if rg -n --glob '*.lean' '\b(sorry|admit)\b|^[[:space:]]*(axiom|unsafe)[[:space:]]' MQGN6Audit MQGN6Audit.lean > /tmp/forbidden-source.log; then
            cat /tmp/forbidden-source.log
            echo 'Forbidden proof source detected.' >&2
            exit 1
          fi
          {
            echo
            echo '### Axiom closure'
            echo
            echo '```text'
            cat /tmp/lean-axioms.log
            echo '```'
          } >> /tmp/lean-comment.md
      - name: Upload final audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mqg-n6-d4-proof-audit-${{ github.run_id }}
          path: |
            /tmp/lean-build.log
            /tmp/lean-axioms.log
            /tmp/forbidden-source.log
            /tmp/lean-comment.md
          if-no-files-found: ignore
          retention-days: 30
      - name: Save post-build Lean environment
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.elan
            lake-manifest.json
            .lake/packages
            .lake/build
          key: mqg-lean-v3-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}
      - name: Save exact-source project build cache
        if: always() && steps.lean.outputs.status == '0' && steps.project-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: mqg-n6d4-project-v1-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}
      - name: Publish sticky diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=${{ github.event.pull_request.number || 1 }}
          existing=$(gh api repos/${{ github.repository }}/issues/$pr/comments --paginate --jq '.[] | select(.body | startswith("<!-- lean-ci-diagnostics -->")) | .id' | head -n1)
          body=$(cat /tmp/lean-comment.md)
          if [ -n "$existing" ]; then
            gh api --method PATCH repos/${{ github.repository }}/issues/comments/$existing -f body="$body" >/dev/null
          else
            gh api --method POST repos/${{ github.repository }}/issues/$pr/comments -f body="$body" >/dev/null
          fi
      - name: Fail if Lean or trust audit failed
        if: steps.lean.outputs.status != '0' || steps.trust.outcome == 'failure'
        run: exit 1
