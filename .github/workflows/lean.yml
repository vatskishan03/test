name: Lean n6 d4 audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: mqg-n6-d4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore complete Lean environment
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan
            lake-manifest.json
            .lake/packages
            .lake/build
          key: mqg-lean-v2-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}
      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies on cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          lake update > /tmp/lake-update.log 2>&1
          lake exe cache get > /tmp/cache-get.log 2>&1
      - name: Save complete Lean environment
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.elan
            lake-manifest.json
            .lake/packages
            .lake/build
          key: mqg-lean-v2-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}
      - name: Build
        id: lean
        run: |
          set +e
          lake build > /tmp/lean-build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo '<!-- lean-ci-diagnostics -->'
            if [ "$status" -eq 0 ]; then
              echo '## Lean audit: passing'
              echo
              echo '```text'
              tail -n 30 /tmp/lean-build.log
              echo '```'
            else
              echo '## Lean audit: compiler diagnostics'
              echo
              echo '```text'
              grep -n -E 'error:|unsolved goals|unknown identifier|application type mismatch|type mismatch|invalid field|declaration uses' /tmp/lean-build.log | tail -n 160 || true
              echo '--- final context ---'
              tail -n 100 /tmp/lean-build.log
              echo '```'
            fi
          } > /tmp/lean-comment.md
          cat /tmp/lean-comment.md
      - name: Publish sticky diagnostics to draft PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh api repos/${{ github.repository }}/issues/1/comments --paginate --jq '.[] | select(.body | startswith("<!-- lean-ci-diagnostics -->")) | .id' | head -n1)
          body=$(cat /tmp/lean-comment.md)
          if [ -n "$existing" ]; then
            gh api --method PATCH repos/${{ github.repository }}/issues/comments/$existing -f body="$body" >/dev/null
          else
            gh api --method POST repos/${{ github.repository }}/issues/1/comments -f body="$body" >/dev/null
          fi
      - name: Fail if Lean failed
        if: steps.lean.outputs.status != '0'
        run: exit 1
