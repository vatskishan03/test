name: Lean n6 d4 audit

on:
  push:
    branches:
      - research/n6-d4-lean-audit-20260727
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mqg-n6-d4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Lean and Lake cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/packages
            .lake/build
          key: mqg-lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}
      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: |
          lake update > /tmp/lake-update.log 2>&1
          lake exe cache get > /tmp/cache-get.log 2>&1
      - name: Build
        run: |
          set +e
          lake build > /tmp/lean-build.log 2>&1
          status=$?
          tail -n 220 /tmp/lean-build.log
          exit $status
