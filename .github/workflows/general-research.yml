name: Trusted Lean library

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mqg-vm-trusted-build
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, lean-highmem-n8d3]
    timeout-minutes: 120
    env:
      LAKE_WORKERS: "1"
      LEAN_RSS_LIMIT_KB: "7500000"
      # User-approved read-only dependency-collector exception, 2026-09-05.
      # The actual Lean compiler keeps its original cap above.
      AXIOM_REPORT_RSS_LIMIT_KB: "15000000"
      LEAN_AGGREGATE_RSS_LIMIT_KB: "46000000"
      MEM_AVAILABLE_FLOOR_KB: "8000000"
      LEAN_ELAPSED_LIMIT_SECONDS: "295"
      DISK_AVAILABLE_FLOOR_KB: "1000000"
      MQG_VM_SEED: ${{ vars.LEAN_VM_SEED }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare VM-local logs and temporary directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ci-logs" "$GITHUB_WORKSPACE/.ci-tmp"
          echo "TMPDIR=$GITHUB_WORKSPACE/.ci-tmp" >> "$GITHUB_ENV"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          test -x "$HOME/.elan/bin/lake"
      - name: Test supervisor and source/axiom gates
        run: |
          python3 scripts/ci/test_guarded_run.py
          python3 scripts/ci/test_audit_trust.py
          python3 scripts/ci/test_cache_config.py
          python3 -c 'import sys; sys.path.insert(0,"scripts/ci"); from audit_trust import check_sources; check_sources()'
      - name: Prepare pinned dependencies and source-matched warm cache
        run: |
          if [ -n "$MQG_VM_SEED" ]; then
            python3 scripts/ci/guarded_run.py "$GITHUB_WORKSPACE" .ci-logs/cache-seed.log -- \
              python3 scripts/ci/prepare_vm_cache.py "$GITHUB_WORKSPACE" "$MQG_VM_SEED"
          fi
          if [ ! -f lake-manifest.json ]; then
            python3 scripts/ci/guarded_run.py "$GITHUB_WORKSPACE" .ci-logs/dependencies.log -- lake update
          fi
          if [ ! -d .lake/packages/mathlib/.lake/build ]; then
            python3 scripts/ci/guarded_run.py "$GITHUB_WORKSPACE" .ci-logs/dependencies.log -- lake exe cache get
          fi
      - name: Build BOTH complete root libraries
        run: bash scripts/ci/guarded_lake_build.sh "$GITHUB_WORKSPACE" .ci-logs/build.log
      - name: Audit exact theorem dependencies under the same resource limits
        run: |
          bash scripts/ci/guarded_lake_build.sh "$GITHUB_WORKSPACE" .ci-logs/axiom-reporter-build.log axiom_report
          python3 scripts/ci/run_axiom_audits.py "$GITHUB_WORKSPACE" ".ci-logs/axioms-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          git diff --check
      - name: Publish build summary
        if: always()
        run: |
          {
            echo '## Trusted Lean validation'
            echo "Commit: $GITHUB_SHA"
            echo 'An overall success requires both root libraries and the exact axiom allowlist.'
            for log in .ci-logs/*.log; do
              test -f "$log" || continue
              echo
              echo "### $log"
              echo '```text'
              tail -80 "$log"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trusted-lean-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-logs/
          retention-days: 90
          if-no-files-found: warn
