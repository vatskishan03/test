name: Candidate 129 exact audit

on:
  pull_request:
    branches:
      - research/general-reduction-n8-d3
    paths:
      - "research/candidate129/**"
      - ".github/workflows/candidate129-exact-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate129-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  root-factor:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct exact closure and root factor graph
        run: |
          set -euo pipefail
          /usr/bin/time -v python research/candidate129/probe_candidate129.py \
            research/candidate129/candidate129_support.txt \
            research/candidate129/candidate129_root_factor.json \
            2>&1 | tee research/candidate129/candidate129_root_factor.log
      - name: Upload exact audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate129-root-factor-${{ github.run_id }}
          path: |
            research/candidate129/candidate129_support.txt
            research/candidate129/candidate129_root_factor.json
            research/candidate129/candidate129_root_factor.log
          if-no-files-found: warn
          retention-days: 30
