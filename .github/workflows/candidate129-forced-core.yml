name: Candidate 129 forced core

on:
  pull_request:
    branches:
      - research/general-reduction-n8-d3
    paths:
      - "research/candidate129/audit_candidate129_forced_core.py"
      - ".github/workflows/candidate129-forced-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate129-forced-core-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  forced-core:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact integer-lattice dependency
        run: python -m pip install --disable-pip-version-check sympy==1.14.0
      - name: Propagate singleton obstructions and audit forced core
        run: |
          set -euo pipefail
          /usr/bin/time -v python research/candidate129/audit_candidate129_forced_core.py \
            research/candidate129/candidate129_support.txt \
            research/candidate129/candidate129_forced_core.json \
            2>&1 | tee research/candidate129/candidate129_forced_core.log
      - name: Upload forced-core audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate129-forced-core-${{ github.run_id }}
          path: |
            research/candidate129/candidate129_forced_core.json
            research/candidate129/candidate129_forced_core.log
          if-no-files-found: warn
          retention-days: 30
